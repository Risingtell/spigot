name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # An advisory published against a version already shipped is the case a
  # push-triggered check never sees, so audit on a clock as well.
  schedule:
    - cron: "17 6 * * *"

# The job only reads the repo; nothing it runs should be able to write to it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Every test runs offline against a fake settlement provider, so CI needs
      # no key, no wallet and no network access to a chain.
      - run: npm test
      - run: npm run build
      # Fails the run on a high or critical advisory. The low and moderate tail
      # lives inside Circle's SDKs with no fix published upstream, so it is
      # reported, not gated. Highs with no usable fix are listed, with reasons,
      # in the script.
      - run: node scripts/audit-gate.mjs
